<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Web Design</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        html,
        body {
            min-height: 100%;
            background-color: #91FFB2;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Roboto Mono';
            color: #222;
            min-height: 100vh;
        }

        .hero {
            width: 1100px;
            margin: auto;
            padding-top: 60px;

            display: flex;
            justify-content: space-between;
        }

        .sec-1 {
            width: 550px;
        }

        .sec-1 h1 {
            font-size: 2.7rem;
            margin: 0;
            margin-bottom: 25px;
        }

        .sec-1 p {
            width: 430px;
            font-size: 1rem;
            line-height: 1.5;
        }

        .sec-1 button {
            background-color: #333333;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 13px 35px;
            margin-top: 10px;
            font-family: 'Roboto Mono';
        }

        .sec-1 button:hover {
            background-color: black;
        }

        .small-picture {
            display: flex;
            gap: 30px;
            margin-top: 80px;
        }

        .small-picture img {
            width: 240px;
            height: 135px;
            object-fit: cover;
        }

        .sec-2 {
            width: 220px;
        }

        .sec-2 img {
            width: 200px;
            height: 540px;
            object-fit: cover;
        }

        .sec-3 {
            width: 130px;
        }

        .sec-3 img {
            width: 120px;
            height: 540px;
            object-fit: cover;
        }

        .footer {
            text-align: center;

            font-size: 0.75rem;

            margin-top: 30px;
            padding-bottom: 20px;
        }

        .footer p {
            margin: 3px;
        }
    </style>
</head>

<body>

    <!-- ส่วนของ hero -->
    <div class="hero">
        <!-- sec-1 -->
        <div class="sec-1">
            <h1>
                My Web Design by <br>
                HTML CSS.
            </h1>
            <p>
                Lorem ipsum dolor sit amet,
                consectetur adipiscing elit.
                Cursus imperdiet sed id elementum.
                Quam vel aliquam sit vulputate.
            </p>
            <button>Follow Me</button>
            <!-- รูปด้านล่าง -->
            <div class="small-picture">
                <img src="./images/pic1.png" alt="pic1">
                <img src="./images/pic2.png" alt="pic2">
            </div>
        </div>
        <!-- sec-2 -->
        <div class="sec-2">
            <img src="./images/pic3.png" alt="pic3">
        </div>
        <!-- sec-3 -->
        <div class="sec-3">
            <img src="./images/pic4.png" alt="pic4">
        </div>
    </div>
    <!-- footer -->
    <div class="footer">
        <p>(รูปและเนื้อหาทั้งหมดใช้เพื่อการศึกษาเท่านั้น)</p>
        <p>Created by Tanapat Srirabay</p>
        <p>Copyright © 2026 WoW WoW WoW</p>
    </div>

</body>

</html>
